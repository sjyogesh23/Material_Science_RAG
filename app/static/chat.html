<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#15191D">
  <title>NewRAG - Materials Science Notebook</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2315191D'/%3E%3Cpath d='M9 11l7-4 7 4v9l-7 4-7-4z' fill='none' stroke='%23D6B25E' stroke-width='2'/%3E%3Ccircle cx='16' cy='15.5' r='2.2' fill='%23D6B25E'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/static/vendor/highlight/github-dark-dimmed.min.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/chat.css">
  <script defer src="/static/vendor/marked/marked.umd.js"></script>
  <script defer src="/static/vendor/dompurify/purify.min.js"></script>
  <script defer src="/static/vendor/katex/katex.min.js"></script>
  <script defer src="/static/vendor/katex/contrib/auto-render.min.js"></script>
  <script defer src="/static/vendor/highlight/highlight.min.js"></script>
  <script type="module" src="/static/js/chat.js"></script>
</head>
<body>
  <a class="skip-link" href="#composer-input">Skip to question box</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="sidebar__head">
        <a class="brand" href="/" aria-label="NewRAG home">
          <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 11l7-4 7 4v9l-7 4-7-4z"/><path d="M9 11l7 4 7-4M16 15v9"/></svg>
          <span class="brand__name">NewRAG</span>
        </a>
        <button class="icon-btn sidebar__close" id="sidebar-close" type="button" aria-label="Close conversation list">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <button class="btn new-chat" id="new-chat" type="button">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
        New chat
      </button>
      <nav class="sessions" id="sessions" aria-label="Past conversations">
        <p class="sessions__empty">No conversations yet.</p>
      </nav>
      <div class="sidebar__foot">
        <a class="foot-link" href="/audit">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 13.5h11M4 11V7M7 11V4M10 11V8M13 11V5.5"/></svg>
          Token audit &amp; settings
        </a>
        <p class="offline-note">Runs offline on this machine.</p>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn topbar__menu" id="sidebar-open" type="button" aria-label="Open conversation list" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
        </button>
        <h1 class="topbar__title" id="chat-title">New conversation</h1>
        <div class="stage" id="stage" role="status" aria-live="polite" hidden>
          <ol class="stage__ticks" aria-hidden="true">
            <li data-stage="routing"></li><li data-stage="retrieving"></li><li data-stage="reranking"></li><li data-stage="generating"></li><li data-stage="validating"></li>
          </ol>
          <span class="stage__label" id="stage-label">Routing…</span>
        </div>
      </header>

      <div class="banner" id="health-banner" role="alert" hidden></div>

      <section class="thread" id="thread" aria-label="Conversation">
        <div class="thread__inner" id="messages" aria-live="polite" aria-relevant="additions"></div>
      </section>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer__box">
          <label class="sr-only" for="composer-input">Ask about the materials science textbook</label>
          <textarea id="composer-input" class="composer__input" rows="1" maxlength="4000" aria-describedby="composer-count mode-note" placeholder="Ask about crystal structures, defects, phase diagrams…" spellcheck="true"></textarea>
          <div class="composer__tools">
            <div class="modes" id="mode-picker" role="radiogroup" aria-label="Answer mode"></div>
            <p class="mode-note" id="mode-note" aria-live="polite"></p>
            <button class="composer__send" id="send-btn" type="submit" aria-label="Send question">
              <svg class="i-send" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg>
              <svg class="i-stop" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <p class="composer__hint"><span class="composer__count num" id="composer-count" aria-live="polite">0 / 4,000</span>Enter sends, Shift+Enter adds a line. Every answer cites the textbook pages it draws on.</p>
      </form>
    </main>
  </div>

  <!-- floating citation card -->
  <div class="cite-card" id="cite-card" role="tooltip" hidden></div>

  <!-- page / figure viewer -->
  <dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
    <div class="viewer__bar">
      <h2 class="viewer__title" id="viewer-title"></h2>
      <div class="viewer__nav">
        <button class="icon-btn" id="viewer-prev" type="button" aria-label="Previous page">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg>
        </button>
        <span class="viewer__count num" id="viewer-count"></span>
        <button class="icon-btn" id="viewer-next" type="button" aria-label="Next page">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg>
        </button>
        <button class="icon-btn" id="viewer-close" type="button" aria-label="Close viewer">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </div>
    <div class="viewer__body" id="viewer-body"></div>
    <p class="viewer__caption" id="viewer-caption"></p>
  </dialog>

  <!-- session ⋮ menu (one shared instance, positioned next to the opening button) -->
  <div class="menu" id="sess-menu" role="menu" hidden>
    <button type="button" class="menu__item" role="menuitem" tabindex="-1" data-cmd="rename">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 3l2.5 2.5L6 12.5H3.5V10z"/></svg>
      Rename
    </button>
    <button type="button" class="menu__item" role="menuitem" tabindex="-1" data-cmd="memory">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3.5 2.5h6l3 3v8h-9z"/><path d="M5.5 7.5h5M5.5 10h5M5.5 5h2.5"/></svg>
      Show session memory
    </button>
    <div class="menu__sep" role="separator"></div>
    <button type="button" class="menu__item menu__item--danger" role="menuitem" tabindex="-1" data-cmd="delete">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>
      Delete
    </button>
  </div>

  <!-- session memory -->
  <dialog class="sheet" id="memory-dlg" aria-labelledby="memory-title" aria-describedby="memory-sub">
    <div class="sheet__bar">
      <div class="sheet__heading">
        <h2 class="sheet__title" id="memory-title">Session memory</h2>
        <p class="sheet__sub" id="memory-sub"></p>
      </div>
      <button class="icon-btn" type="button" data-close aria-label="Close session memory">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="mem-meter" id="memory-meter">
      <div class="mem-meter__bar" role="meter" id="memory-bar" aria-label="Memory size against the token budget" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><span class="mem-meter__fill"></span></div>
      <p class="mem-meter__text num" id="memory-meter-text"></p>
    </div>
    <div class="sheet__body prose prose--compact" id="memory-body" tabindex="0" aria-label="Memory file contents"></div>
    <div class="sheet__foot">
      <p class="sheet__path" id="memory-path"></p>
      <button type="button" class="btn" id="memory-compact">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5h10M5 8h6M6.5 10.5h3"/></svg>
        Compact now
      </button>
      <button type="button" class="btn" data-close>Close</button>
    </div>
  </dialog>

  <!-- confirm (replaces window.confirm) -->
  <dialog class="sheet sheet--confirm" id="confirm-dlg" role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <div class="sheet__pad">
      <h2 class="sheet__title" id="confirm-title"></h2>
      <p class="sheet__text" id="confirm-body"></p>
      <div class="sheet__actions">
        <button type="button" class="btn" id="confirm-cancel" autofocus>Cancel</button>
        <button type="button" class="btn btn--danger-solid" id="confirm-ok">Delete</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
